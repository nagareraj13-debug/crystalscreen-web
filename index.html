<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#030305" />
  <title>CrystalScreen</title>
  <style>
    /* ========= STEALTH MONOCHROME LUXURY TOKENS ========= */
    :root {
      --bg: #030305;
      --surface: rgba(255, 255, 255, 0.045);
      --surface-strong: rgba(255, 255, 255, 0.085);
      --border: rgba(255, 255, 255, 0.095);
      --border-top: rgba(255, 255, 255, 0.18);
      --border-focus: rgba(255, 255, 255, 0.42);
      --text: #f8fafc;
      --text-secondary: #828894;
      --title-grad-1: #ffffff;
      --title-grad-2: #9ca3af;
      --logo-hi: #ffffff;
      --logo-mid: #d4d4d8;
      --logo-lo: #52525b;
      --logo-glow: rgba(255, 255, 255, 0.16);
      --spotlight: rgba(255, 255, 255, 0.075);
      --grid-line: rgba(255, 255, 255, 0.028);
      --btn-bg: #ffffff;
      --btn-text: #050507;
      --btn-shadow: 0 12px 32px rgba(255, 255, 255, 0.12);
      --accent: #38bdf8;
      --danger: #fb7185;
      --success: #34d399;
      --sheet-bg: rgba(12, 13, 17, 0.96);
      --hud-bg: rgba(10, 11, 15, 0.74);
      --hud-text: #f8fafc;
      --hud-border: rgba(255, 255, 255, 0.14);
      --stage-bg: #000000;
    }

    [data-theme="light"] {
      --bg: #f6f7f9;
      --surface: rgba(9, 9, 11, 0.04);
      --surface-strong: rgba(9, 9, 11, 0.08);
      --border: rgba(9, 9, 11, 0.09);
      --border-top: rgba(255, 255, 255, 0.9);
      --border-focus: rgba(9, 9, 11, 0.42);
      --text: #09090b;
      --text-secondary: #64748b;
      --title-grad-1: #09090b;
      --title-grad-2: #52525b;
      --logo-hi: #09090b;
      --logo-mid: #27272a;
      --logo-lo: #a1a1aa;
      --logo-glow: rgba(9, 9, 11, 0.12);
      --spotlight: rgba(9, 9, 11, 0.045);
      --grid-line: rgba(9, 9, 11, 0.032);
      --btn-bg: #09090b;
      --btn-text: #ffffff;
      --btn-shadow: 0 14px 30px rgba(9, 9, 11, 0.18);
      --accent: #0284c7;
      --danger: #e11d48;
      --success: #059669;
      --sheet-bg: rgba(255, 255, 255, 0.97);
      --hud-bg: rgba(255, 255, 255, 0.85);
      --hud-text: #09090b;
      --hud-border: rgba(9, 9, 11, 0.12);
      --stage-bg: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background 0.35s ease, color 0.35s ease;
    }

    /* ========= ARCHITECTURAL SPOTLIGHT & SUBTLE GRID ========= */
    .ambient-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .spotlight-beam {
      position: absolute;
      top: -22%;
      left: 50%;
      transform: translateX(-50%);
      width: min(130vw, 620px);
      height: 62vh;
      background: radial-gradient(ellipse at top, var(--spotlight) 0%, transparent 70%);
      filter: blur(20px);
    }

    .subtle-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(circle at 50% 24%, rgba(0, 0, 0, 0.85) 0%, transparent 68%);
      -webkit-mask-image: radial-gradient(circle at 50% 24%, rgba(0, 0, 0, 0.85) 0%, transparent 68%);
    }

    /* ========= VIEWS ========= */
    .view {
      position: fixed;
      inset: 0;
      z-index: 1;
      transition: opacity 0.38s ease, transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .view.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.985);
    }

    /* ========= VIEW 1: PREMIUM UPPER-BALANCED FULLSCREEN AUTH ========= */
    #authView {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(18px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom));
      max-width: 450px;
      margin: 0 auto;
      width: 100%;
    }

    /* Clean Right-Aligned Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      width: 100%;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .circle-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border);
      box-shadow: inset 0 1px 0 var(--border-top);
      background: var(--surface);
      color: var(--text);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .circle-btn:active { transform: scale(0.92); }
    .circle-btn:hover { background: var(--surface-strong); }

    /* Upper-Shifted Minimal Brand Block (No Box) */
    .hero-block {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      padding-top: clamp(46px, 12vh, 118px);
    }

    .apex-logo-wrap {
      width: 62px;
      height: 62px;
      margin-bottom: 18px;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 8px 24px var(--logo-glow));
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .apex-logo-wrap svg {
      width: 58px;
      height: 58px;
      stroke: none;
    }

    .apex-logo-wrap.pulsing {
      animation: apexPulse 1.8s ease-in-out infinite;
    }

    @keyframes apexPulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.07); opacity: 1; }
    }

    .hero-title {
      font-size: 1.92rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.1;
      background: linear-gradient(180deg, var(--title-grad-1) 25%, var(--title-grad-2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }

    .tagline-line {
      width: 22px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--text-secondary));
      opacity: 0.55;
    }

    .tagline-line.right {
      background: linear-gradient(90deg, var(--text-secondary), transparent);
    }

    .hero-kicker {
      font-size: 0.64rem;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--text-secondary);
      padding-left: 0.28em;
    }

    .hero-sub {
      margin-top: 14px;
      font-size: 0.84rem;
      color: var(--text-secondary);
      font-weight: 400;
      max-width: 265px;
      line-height: 1.5;
      opacity: 0.88;
    }

    /* Bottom Action Zone (Floating Glass Controls) */
    .action-zone {
      width: 100%;
      padding-bottom: 4px;
    }

    .input-pill {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      height: 54px;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: inset 0 1px 0 var(--border-top);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: border-color 0.22s, background 0.22s;
      margin-bottom: 12px;
    }

    .input-pill:focus-within {
      border-color: var(--border-focus);
      background: var(--surface-strong);
    }

    .input-pill input {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      padding: 0 50px 0 18px;
      color: var(--text);
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      user-select: text;
    }

    .input-pill input::placeholder {
      color: var(--text-secondary);
      opacity: 0.8;
    }

    .eye-btn {
      position: absolute;
      right: 7px;
      width: 40px;
      height: 40px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    /* High-Contrast Monochrome Primary Button */
    .btn-luxury {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: 16px;
      background: var(--btn-bg);
      color: var(--btn-text);
      font-size: 0.94rem;
      font-weight: 650;
      letter-spacing: 0.01em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: var(--btn-shadow);
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .btn-luxury:active { transform: scale(0.98); }
    .btn-luxury:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-subtle {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.84rem;
      font-weight: 500;
      cursor: pointer;
    }

    /* 6-Digit PIN Visual Slots */
    .pin-container {
      position: relative;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .pin-slot {
      height: 54px;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: inset 0 1px 0 var(--border-top);
      display: grid;
      place-items: center;
      font-size: 1.32rem;
      font-weight: 700;
      color: var(--text);
      transition: border-color 0.2s, transform 0.15s;
    }

    .pin-slot.active {
      border-color: var(--border-focus);
      background: var(--surface-strong);
      transform: translateY(-1px);
    }

    .pin-real-input {
      position: absolute;
      inset: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: text;
      user-select: text;
    }

    .status-line {
      min-height: 22px;
      margin-top: 14px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-secondary);
      line-height: 1.4;
      letter-spacing: 0.01em;
    }
    .status-line.error { color: var(--danger); }
    .status-line.success { color: var(--success); }

    /* ========= VIEW 2: YOUTUBE-STYLE FULLSCREEN STAGE ========= */
    #stageView {
      background: var(--stage-bg);
      touch-action: none;
    }

    #canvasWrap {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #screenCanvas {
      max-width: 100vw;
      max-height: 100dvh;
      width: auto;
      height: auto;
      display: block;
      touch-action: none;
      transition: filter 0.3s ease;
    }

    #screenCanvas.blurred { filter: blur(30px) brightness(0.32); }
    #screenCanvas.grayscale { filter: grayscale(100%) contrast(1.08); }
    #screenCanvas.blurred.grayscale { filter: blur(30px) grayscale(100%) brightness(0.32); }

    .touch-ripple {
      position: fixed;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: rgba(255, 255, 255, 0.22);
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.4);
      animation: rippleOut 0.4s ease-out forwards;
      z-index: 15;
    }

    @keyframes rippleOut {
      to { transform: translate(-50%, -50%) scale(1.6); opacity: 0; }
    }

    .privacy-banner {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 18;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .privacy-banner.active { opacity: 1; pointer-events: auto; }
    .privacy-pill {
      padding: 12px 20px;
      border-radius: 999px;
      background: var(--hud-bg);
      color: var(--hud-text);
      backdrop-filter: blur(20px);
      border: 1px solid var(--hud-border);
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* YouTube-Style Auto-Hide HUD */
    .hud-reveal-handle {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      padding: 6px 18px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.42);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      cursor: pointer;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .hud-reveal-handle span {
      width: 28px;
      height: 3.5px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.78);
      display: block;
    }

    .hud-visible .hud-reveal-handle {
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -12px);
    }

    .hud-top {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: max(14px, env(safe-area-inset-top)) 16px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 30;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.58), transparent);
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease;
    }

    .hud-visible .hud-top {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .hud-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      border-radius: 999px;
      background: var(--hud-bg);
      color: var(--hud-text);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--hud-border);
      font-size: 0.75rem;
      font-weight: 600;
    }

    .hud-icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--hud-border);
      background: var(--hud-bg);
      color: var(--hud-text);
      backdrop-filter: blur(18px);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .hud-icon-btn:active { transform: scale(0.9); }
    .hud-icon-btn.danger {
      background: rgba(225, 29, 72, 0.9);
      color: #fff;
      border-color: transparent;
    }

    .hud-bottom {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translate(-50%, 130%);
      opacity: 0;
      pointer-events: none;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: min(92vw, 420px);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease;
    }

    .hud-visible .hud-bottom {
      transform: translate(-50%, 0);
      opacity: 1;
      pointer-events: auto;
    }

    .nav-strip {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 6px 20px;
      border-radius: 999px;
      background: var(--hud-bg);
      backdrop-filter: blur(22px);
      border: 1px solid var(--hud-border);
    }

    .nav-btn {
      width: 44px;
      height: 34px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--hud-text);
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .nav-btn:active { transform: scale(0.88); }

    .dock-bar {
      width: 100%;
      padding: 7px 8px;
      border-radius: 22px;
      background: var(--hud-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--hud-border);
      display: flex;
      align-items: center;
      justify-content: space-around;
    }

    .dock-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 4px;
      border-radius: 14px;
      border: none;
      background: transparent;
      color: var(--hud-text);
      font-size: 0.66rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s;
    }
    .dock-btn:active { transform: scale(0.9); }
    .dock-btn.active { color: var(--accent); }

    /* ========= BOTTOM SHEETS (SERVER URL & CLIPBOARD) ========= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.58);
      backdrop-filter: blur(8px);
      z-index: 50;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-backdrop.open { opacity: 1; pointer-events: auto; }

    .sheet {
      width: min(100vw, 460px);
      padding: 14px 22px max(26px, env(safe-area-inset-bottom));
      border-radius: 28px 28px 0 0;
      background: var(--sheet-bg);
      border-top: 1px solid var(--border);
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .modal-backdrop.open .sheet { transform: translateY(0); }

    .sheet-grabber {
      width: 38px;
      height: 4px;
      border-radius: 99px;
      background: var(--border-focus);
      margin: 0 auto 16px;
      opacity: 0.45;
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .sheet-header h3 {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .sheet-label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .sheet-textarea {
      width: 100%;
      padding: 13px 15px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.92rem;
      outline: none;
      user-select: text;
      margin-bottom: 14px;
      font-family: inherit;
    }

    .received-box {
      padding: 12px 14px;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .received-box span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mini-btn {
      padding: 7px 13px;
      border-radius: 10px;
      border: none;
      background: var(--btn-bg);
      color: var(--btn-text);
      font-size: 0.75rem;
      font-weight: 650;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: max(68px, env(safe-area-inset-top));
      left: 50%;
      transform: translate(-50%, -14px);
      padding: 9px 16px;
      border-radius: 999px;
      background: var(--hud-bg);
      color: var(--hud-text);
      border: 1px solid var(--hud-border);
      backdrop-filter: blur(18px);
      font-size: 0.78rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      z-index: 60;
      transition: opacity 0.25s, transform 0.25s;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>
  <!-- Architectural Spotlight Background -->
  <div class="ambient-canvas" id="ambientCanvas">
    <div class="spotlight-beam"></div>
    <div class="subtle-grid"></div>
  </div>
  <div class="toast" id="toast"></div>

  <!-- ================= VIEW 1: PREMIUM FULLSCREEN AUTH ================= -->
  <main class="view" id="authView">
    <!-- Minimal Right-Aligned Top Controls -->
    <header class="top-bar">
      <div class="top-actions">
        <button class="circle-btn" id="openServerBtn" title="Server Settings" aria-label="Server Settings">

  <!-- ================= SERVER URL SHEET ================= -->
  <div class="modal-backdrop" id="serverModal">

  <!-- ================= GHOST CLIPBOARD SHEET ================= -->
  <div class="modal-backdrop" id="clipModal">
    <div class="sheet">
      <div class="sheet-grabber"></div>
      <div class="sheet-header">
        <h3>Ghost Clipboard</h3>
        <button class="circle-btn" id="closeClipBtn" style="width:34px;height:34px;">✕</button>

        <span id="receivedClipText">No OTP or text received yet.</span>
        <button class="mini-btn" id="copyReceivedBtn">Copy</button>
      </div>
      <label class="sheet-label" for="sendClipInput">Send text to phone</label>

      <button class="btn-luxury" id="sendClipBtn">Send to Phone</button>
    </div>
  </div>

  <script>
    // =========================================================================
    // RENDER LIVE ZALYAVAR TUZYA SERVER CHI URL ITHE PASTE KAR
    // =========================================================================
    const DEFAULT_SERVER_URL = "https://crystalscreen-server.onrender.com";

    // DOM Elements
    const authView = document.getElementById("authView");
    const stageView = document.getElementById("stageView");
    const ambientCanvas = document.getElementById("ambientCanvas");
    const brandEmblem = document.getElementById("brandEmblem");
    const heroTitle = document.getElementById("heroTitle");
    const heroSub = document.getElementById("heroSub");
    const loginStep = document.getElementById("loginStep");
    const pinStep = document.getElementById("pinStep");
    const authStatus = document.getElementById("authStatus");
    const passwordInput = document.getElementById("passwordInput");
    const pinInput = document.getElementById("pinInput");
    const pinSlotEls = document.querySelectorAll("#pinSlots .pin-slot");
    const connectBtn = document.getElementById("connectBtn");
    const verifyPinBtn = document.getElementById("verifyPinBtn");
    const cancelPinBtn = document.getElementById("cancelPinBtn");

    const serverModal = document.getElementById("serverModal");
    const serverUrlInput = document.getElementById("serverUrlInput");
    const canvasWrap = document.getElementById("canvasWrap");
    const canvas = document.getElementById("screenCanvas");
    const ctx = canvas.getContext("2d");
    const hudRevealHandle = document.getElementById("hudRevealHandle");
    const hudBattery = document.getElementById("hudBattery");
    const hudFps = document.getElementById("hudFps");
    const qualityBtn = document.getElementById("qualityBtn");
    const qualityLabel = document.getElementById("qualityLabel");
    const blurBtn = document.getElementById("blurBtn");
    const privacyBanner = document.getElementById("privacyBanner");
    const clipModal = document.getElementById("clipModal");
    const receivedClipText = document.getElementById("receivedClipText");
    const sendClipInput = document.getElementById("sendClipInput");
    const toastEl = document.getElementById("toast");

    // Runtime State
    let ws = null;
    let isSessionActive = false;
    let hudTimer = null;
    let qualityModes = ["MED", "HD", "LOW_GRAY"];
    let qualityIdx = 0;
    let isBlurred = false;
    let frameCount = 0;
    let lastReceivedClip = "";
    let toastTimer = null;

    // Load Saved Server URL
    serverUrlInput.value = localStorage.getItem("cs_server_url") || DEFAULT_SERVER_URL;

    // ========= THEME ENGINE (DARK / BRIGHT) =========
    const SUN_SVG = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
    const MOON_SVG = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem("cs_theme", theme);
      const icon = theme === "dark" ? SUN_SVG : MOON_SVG;
      document.getElementById("themeIconAuth").innerHTML = icon;
      document.getElementById("themeIconHud").innerHTML = icon;
      document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "dark" ? "#030305" : "#f6f7f9");
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute("data-theme") || "dark";
      applyTheme(current === "dark" ? "light" : "dark");
    }

    applyTheme(localStorage.getItem("cs_theme") || "dark");
    document.getElementById("themeBtnAuth").addEventListener("click", toggleTheme);
    document.getElementById("themeBtnHud").addEventListener("click", () => { toggleTheme(); resetHudTimer(); });

    // ========= PASSWORD EYE TOGGLE =========
    document.getElementById("eyeBtn").addEventListener("click", () => {
      const isPass = passwordInput.type === "password";
      passwordInput.type = isPass ? "text" : "password";
      document.getElementById("eyeIcon").innerHTML = isPass
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><line x1="1" y1="1" x2="23" y2="23"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    });

    // ========= SERVER URL BOTTOM SHEET =========
    document.getElementById("openServerBtn").addEventListener("click", () => serverModal.classList.add("open"));
    document.getElementById("closeServerBtn").addEventListener("click", () => serverModal.classList.remove("open"));
    serverModal.addEventListener("click", (e) => { if (e.target === serverModal) serverModal.classList.remove("open"); });
    document.getElementById("saveServerBtn").addEventListener("click", () => {
      const url = serverUrlInput.value.trim();
      if (!url) return showToast("Enter a valid Render URL");
      localStorage.setItem("cs_server_url", url);
      serverModal.classList.remove("open");
      showToast("Server URL saved");
    });

    // ========= UI HELPERS =========
    function setStatus(msg, type = "") {
      authStatus.textContent = msg;
      authStatus.className = "status-line " + type;
    }

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
    }

    function renderPinSlots() {
      const val = pinInput.value;
      pinSlotEls.forEach((slot, i) => {
        slot.textContent = val[i] || "";
        slot.classList.toggle("active", i === val.length || (val.length === 6 && i === 5));
      });
    }

    // ========= YOUTUBE-STYLE HUD AUTO-HIDE =========
    function showHud() {
      stageView.classList.add("hud-visible");
      resetHudTimer();
    }

    function hideHud() {
      stageView.classList.remove("hud-visible");
      clearTimeout(hudTimer);
    }

    function toggleHud() {
      if (stageView.classList.contains("hud-visible")) hideHud();
      else showHud();
    }

    function resetHudTimer() {
      clearTimeout(hudTimer);
      hudTimer = setTimeout(() => {
        if (!clipModal.classList.contains("open")) hideHud();
      }, 3800);
    }

    hudRevealHandle.addEventListener("click", (e) => { e.stopPropagation(); showHud(); });
    document.getElementById("hideHudBtn").addEventListener("click", (e) => { e.stopPropagation(); hideHud(); });
    canvasWrap.addEventListener("click", (e) => { if (e.target === canvasWrap) toggleHud(); });

    // ========= WEBSOCKET CONNECTION =========
    function toWsUrl(rawUrl) {
      const cleaned = rawUrl.trim().replace(/\/+$/, "");
      if (cleaned.startsWith("ws://") || cleaned.startsWith("wss://")) return cleaned;
      if (cleaned.startsWith("http://")) return cleaned.replace("http://", "ws://");
      if (cleaned.startsWith("https://")) return cleaned.replace("https://", "wss://");
      return "wss://" + cleaned;
    }

    function sendJson(obj) {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
    }

    function resetToLogin(message = "Ready to connect", type = "") {
      isSessionActive = false;
      stageView.classList.add("hidden");
      authView.classList.remove("hidden");
      ambientCanvas.style.display = "block";
      brandEmblem.classList.remove("pulsing");
      heroTitle.textContent = "CrystalScreen";
      heroSub.textContent = "Private live display with instant remote touch control.";
      loginStep.style.display = "block";
      pinStep.style.display = "none";
      connectBtn.disabled = false;
      connectBtn.innerHTML = '<span>Unlock Session</span><svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
      pinInput.value = "";
      renderPinSlots();
      setStatus(message, type);
    }

    function startConnection() {
      const rawUrl = (serverUrlInput.value || DEFAULT_SERVER_URL).trim();
      const password = passwordInput.value;
      if (!rawUrl) {
        serverModal.classList.add("open");
        return setStatus("Set your Render Server URL first.", "error");
      }
      if (!password) return setStatus("Enter your Master Password.", "error");

      localStorage.setItem("cs_server_url", rawUrl);
      connectBtn.disabled = true;
      connectBtn.textContent = "Connecting...";
      brandEmblem.classList.add("pulsing");
      setStatus("Waking encrypted relay...");

      if (ws) { try { ws.close(); } catch (_) {} }
      ws = new WebSocket(toWsUrl(rawUrl));
      ws.binaryType = "blob";

      ws.onopen = () => {
        setStatus("Authenticating...");
        sendJson({
          type: "CONTROLLER_LOGIN",
          password,
          deviceInfo: navigator.userAgent.slice(0, 90)
        });
      };

      ws.onmessage = async (event) => {
        if (event.data instanceof Blob) {
          renderFrame(event.data);
          return;
        }

        let msg;
        try { msg = JSON.parse(event.data); } catch { return; }

        switch (msg.type) {
          case "WAITING_APPROVAL":
            loginStep.style.display = "none";
            pinStep.style.display = "block";
            heroTitle.textContent = "Confirm Access";
            heroSub.textContent = "Tap Allow on your phone or enter the 6-digit PIN shown on screen.";
            setStatus("Waiting for phone approval...", "success");
            pinInput.focus();
            renderPinSlots();
            break;

          case "SESSION_ACTIVE":
            isSessionActive = true;
            brandEmblem.classList.remove("pulsing");
            authView.classList.add("hidden");
            ambientCanvas.style.display = "none";
            stageView.classList.remove("hidden");
            showHud();
            showToast("Connected • 2-finger tap toggles controls");
            break;

          case "AUTH_ERROR":
          case "LOCKED":
          case "HOST_OFFLINE":
          case "BUSY":
          case "DENIED":
            resetToLogin(msg.message || "Connection rejected.", "error");
            break;

          case "PIN_ERROR":
            setStatus(msg.message, "error");
            pinInput.value = "";
            renderPinSlots();
            pinInput.focus();
            break;

          case "FORCE_LOGOUT":
            resetToLogin(msg.reason || "Session ended.", "error");
            break;

          case "STATUS":
            if (typeof msg.battery === "number") {
              hudBattery.textContent = msg.battery + "%" + (msg.charging ? " ⚡" : "");
            }
            break;

          case "CLIPBOARD_SYNC":
            if (msg.text) {
              lastReceivedClip = msg.text;
              receivedClipText.textContent = msg.text;
              showToast("Clipboard / OTP received");
            }
            break;
        }
      };

      ws.onerror = () => {
        brandEmblem.classList.remove("pulsing");
        setStatus("Unable to reach server. Tap ⚙ to check Render URL.", "error");
      };

      ws.onclose = () => {
        if (isSessionActive) {
          resetToLogin("Connection closed.", "error");
        } else {
          brandEmblem.classList.remove("pulsing");
          connectBtn.disabled = false;
          connectBtn.innerHTML = '<span>Unlock Session</span><svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
        }
      };
    }

    connectBtn.addEventListener("click", startConnection);
    passwordInput.addEventListener("keydown", (e) => { if (e.key === "Enter") startConnection(); });

    verifyPinBtn.addEventListener("click", () => {
      const pin = pinInput.value.trim();
      if (pin.length !== 6) return setStatus("Enter the 6-digit PIN.", "error");
      sendJson({ type: "VERIFY_PIN", pin });
    });

    pinInput.addEventListener("input", () => {
      pinInput.value = pinInput.value.replace(/\D/g, "").slice(0, 6);
      renderPinSlots();
      if (pinInput.value.length === 6) sendJson({ type: "VERIFY_PIN", pin: pinInput.value });
    });

    cancelPinBtn.addEventListener("click", () => {
      if (ws) ws.close();
      resetToLogin("Request cancelled.");
    });

    // ========= HIGH-SPEED CANVAS RENDERER =========
    let rendering = false;
    async function renderFrame(blob) {
      if (rendering) return;
      rendering = true;
      try {
        if (window.createImageBitmap) {
          const bitmap = await createImageBitmap(blob);
          if (canvas.width !== bitmap.width || canvas.height !== bitmap.height) {
            canvas.width = bitmap.width;
            canvas.height = bitmap.height;
          }
          ctx.drawImage(bitmap, 0, 0);
          bitmap.close();
        } else {
          const url = URL.createObjectURL(blob);
          const img = new Image();
          await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
          if (canvas.width !== img.width || canvas.height !== img.height) {
            canvas.width = img.width;
            canvas.height = img.height;
          }
          ctx.drawImage(img, 0, 0);
          URL.revokeObjectURL(url);
        }
        frameCount++;
      } catch (_) {
      } finally {
        rendering = false;
      }
    }

    setInterval(() => {
      if (isSessionActive) hudFps.textContent = frameCount + " fps";
      frameCount = 0;
    }, 1000);

    // ========= TOUCH & SWIPE REMOTE CONTROL =========
    let pointerStart = null;
    let twoFingerDetected = false;

    function getNormalizedCoords(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const x = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
      const y = Math.min(1, Math.max(0, (clientY - rect.top) / rect.height));
      return { x: Number(x.toFixed(4)), y: Number(y.toFixed(4)) };
    }

    function spawnRipple(clientX, clientY) {
      const r = document.createElement("div");
      r.className = "touch-ripple";
      r.style.left = clientX + "px";
      r.style.top = clientY + "px";
      document.body.appendChild(r);
      setTimeout(() => r.remove(), 420);
    }

    function handleGestureStart(clientX, clientY) {
      if (!isSessionActive || isBlurred) return;
      pointerStart = { x: clientX, y: clientY, time: Date.now() };
    }

    function handleGestureEnd(clientX, clientY) {
      if (!pointerStart || !isSessionActive || isBlurred) return;
      const dx = clientX - pointerStart.x;
      const dy = clientY - pointerStart.y;
      const dist = Math.hypot(dx, dy);
      const duration = Math.min(1200, Math.max(80, Date.now() - pointerStart.time));

      const startNorm = getNormalizedCoords(pointerStart.x, pointerStart.y);
      const endNorm = getNormalizedCoords(clientX, clientY);

      if (dist < 14) {
        sendJson({ type: "TOUCH", x: endNorm.x, y: endNorm.y });
        spawnRipple(clientX, clientY);
      } else {
        sendJson({ type: "SWIPE", x1: startNorm.x, y1: startNorm.y, x2: endNorm.x, y2: endNorm.y, duration });
      }
      pointerStart = null;
    }

    canvas.addEventListener("touchstart", (e) => {
      e.preventDefault();
      if (e.touches.length === 2) {
        twoFingerDetected = true;
        pointerStart = null;
        toggleHud();
        return;
      }
      if (e.touches.length === 1 && !twoFingerDetected) {
        handleGestureStart(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: false });

    canvas.addEventListener("touchmove", (e) => { e.preventDefault(); }, { passive: false });

    canvas.addEventListener("touchend", (e) => {
      e.preventDefault();
      if (twoFingerDetected) {
        if (e.touches.length === 0) twoFingerDetected = false;
        return;
      }
      if (e.changedTouches.length > 0) {
        handleGestureEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
      }
    }, { passive: false });

    canvas.addEventListener("mousedown", (e) => { if (e.button === 0) handleGestureStart(e.clientX, e.clientY); });
    canvas.addEventListener("mouseup", (e) => { if (e.button === 0) handleGestureEnd(e.clientX, e.clientY); });

    // ========= HUD CONTROLS =========
    document.querySelectorAll("[data-nav]").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        sendJson({ type: "NAV", action: btn.dataset.nav });
        resetHudTimer();
      });
    });

    qualityBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      qualityIdx = (qualityIdx + 1) % qualityModes.length;
      const mode = qualityModes[qualityIdx];
      sendJson({ type: "QUALITY", mode });

      if (mode === "LOW_GRAY") {
        qualityLabel.textContent = "LOW B&W";
        canvas.classList.add("grayscale");
        qualityBtn.classList.add("active");
        showToast("Emergency Low-Data Mode (B&W)");
      } else {
        qualityLabel.textContent = mode;
        canvas.classList.remove("grayscale");
        qualityBtn.classList.toggle("active", mode === "HD");
        showToast("Quality: " + mode);
      }
      resetHudTimer();
    });

    function setPrivacyBlur(state) {
      isBlurred = state;
      canvas.classList.toggle("blurred", state);
      privacyBanner.classList.toggle("active", state);
      blurBtn.classList.toggle("active", state);
    }

    blurBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      setPrivacyBlur(!isBlurred);
      if (isBlurred) hideHud();
      else resetHudTimer();
    });

    privacyBanner.addEventListener("click", () => { setPrivacyBlur(false); showHud(); });

    document.getElementById("ringBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      sendJson({ type: "RING_PHONE" });
      showToast("Ringing phone...");
      resetHudTimer();
    });

    document.getElementById("clipBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      clipModal.classList.add("open");
      clearTimeout(hudTimer);
    });

    document.getElementById("closeClipBtn").addEventListener("click", () => { clipModal.classList.remove("open"); resetHudTimer(); });
    clipModal.addEventListener("click", (e) => { if (e.target === clipModal) { clipModal.classList.remove("open"); resetHudTimer(); } });

    document.getElementById("copyReceivedBtn").addEventListener("click", async () => {
      if (!lastReceivedClip) return showToast("Nothing received yet");
      try {
        await navigator.clipboard.writeText(lastReceivedClip);
        showToast("Copied!");
      } catch {
        showToast("Copy blocked by browser");
      }
    });

    document.getElementById("sendClipBtn").addEventListener("click", () => {
      const text = sendClipInput.value;
      if (!text.trim()) return;
      sendJson({ type: "CLIPBOARD_SEND", text });
      sendClipInput.value = "";
      clipModal.classList.remove("open");
      showToast("Sent to phone clipboard");
      resetHudTimer();
    });

    document.getElementById("fullscreenBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
      else document.exitFullscreen?.();
      resetHudTimer();
    });

    document.getElementById("disconnectBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      sendJson({ type: "DISCONNECT" });
      if (ws) ws.close();
      resetToLogin("Disconnected safely.", "success");
    });
  </script>
</body>
</html>
